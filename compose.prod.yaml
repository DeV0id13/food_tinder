# Production only. Run with: docker compose -f compose.prod.yaml --env-file .env.prod
x-bounded-logs: &bounded_logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  web:
    image: ghcr.io/dev0id13/food_tinder-backend:${IMAGE_TAG:?Required}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      AUTH_RATE_LIMIT_TRUST_PROXY: "true"
    volumes:
      - staticfiles:/app/staticfiles
      - recipe_photos:/app/media/recipes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *bounded_logs
  proxy:
    image: ghcr.io/dev0id13/food_tinder-frontend:${IMAGE_TAG:?Required}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - staticfiles:/srv/static:ro
      - recipe_photos:/srv/media/recipes:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]
    logging: *bounded_logs
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 135MiB
    command:
      - --config.file=/etc/foodtinder/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./deploy/monitoring/prometheus:/etc/foodtinder:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [internal, monitoring]
    logging: *bounded_logs

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    restart: unless-stopped
    cpus: 0.35
    mem_limit: 240m
    env_file:
      - path: .env.monitoring
        required: false
    environment:
      GOMEMLIMIT: 160MiB
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        test "$${#GF_SECURITY_ADMIN_PASSWORD}" -ge 24 || {
          echo 'Set a generated GF_SECURITY_ADMIN_PASSWORD (at least 24 characters) in .env.monitoring.' >&2
          exit 1
        }
        exec /run.sh
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [monitoring]
    logging: *bounded_logs

  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    cpus: 0.10
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/host/root
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.filesystem.mount-points-include=^/$$
      - --collector.filesystem.fs-types-exclude=^$$
      - --collector.diskstats
      - --collector.diskstats.device-exclude=^(loop|ram|zram|dm-)[0-9]+$$
      - --collector.netdev
      - --no-collector.netdev.netlink
      - --collector.netdev.device-exclude=^(lo|docker.*|veth.*|br-.*)$$
      - --collector.pressure
    volumes:
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /proc/1/net:/host/proc/net:ro
    networks: [monitoring]
    logging: *bounded_logs
networks:
  internal:
  monitoring:
volumes:
  postgres_data:
  staticfiles:
  recipe_photos:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
