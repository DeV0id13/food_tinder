# Weekly re-assessment of the current master production image with an updated CVE database.
# schedule + workflow_dispatch become runnable when this workflow exists on default branch.
name: security
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-trivy:
    name: weekly-trivy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - name: Build fresh production image
        run: docker build --pull --target production -t foodtinder-backend:weekly .
      - name: Initialize Trivy report artifact
        run: printf 'Trivy has not completed yet. Inspect workflow logs.\\n' > trivy-full.txt
      - name: Trivy full vulnerability report (all severities)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: foodtinder-backend:weekly
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          trivy-config: .github/security/trivy.yaml
          cache: "false"
          output: trivy-full.txt
      - name: Trivy HIGH/CRITICAL blocking gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: foodtinder-backend:weekly
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          trivy-config: .github/security/trivy.yaml
          cache: "false"
          output: trivy-blocking.txt
      - name: Upload Trivy reports even if a gate failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-weekly
          path: |
            trivy-full.txt
            trivy-blocking.txt
          if-no-files-found: error

