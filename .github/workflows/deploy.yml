name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish and deploy
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build production images
        run: |
          docker build --target production -t ghcr.io/devoid13/food_tinder-backend:"$GITHUB_SHA" .
          docker build -f deploy/Dockerfile.frontend -t ghcr.io/devoid13/food_tinder-frontend:"$GITHUB_SHA" .

      - name: Publish immutable image tags
        run: |
          docker push ghcr.io/devoid13/food_tinder-backend:"$GITHUB_SHA"
          docker push ghcr.io/devoid13/food_tinder-frontend:"$GITHUB_SHA"

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy-key
          printf '%s\n' "$HOST_KEYS" > /tmp/deploy-known-hosts
          test -n "$DEPLOY_HOST"
          ssh -i /tmp/deploy-key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/tmp/deploy-known-hosts \
              "foodtinder-mac@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          cd /opt/foodtinder
          # The manifest and images must be from the same reviewed commit.
          git fetch --prune origin master
          test "$(git rev-parse origin/master)" = "$IMAGE_TAG"
          git checkout -q master
          git reset --hard "$IMAGE_TAG"
          test -f .env.prod || { echo "Missing .env.prod" >&2; exit 1; }
          export IMAGE_TAG
          compose() { sudo -n docker compose -f compose.prod.yaml --env-file .env.prod "$@"; }
          compose pull
          compose up -d --wait postgres
          # Named volumes start owned by root; allow the unprivileged Django app to write media/static.
          compose run --rm --user root web sh -c 'chown -R app:app /app/staticfiles /app/media/recipes'
          compose run --rm web python manage.py migrate --noinput
          compose run --rm web python manage.py collectstatic --noinput
          compose up -d --remove-orphans web proxy
          compose ps
          # Internal Django health check uses the configured allowed hostname.
          compose exec -T web python manage.py shell -c \
              "from django.conf import settings; from django.test import Client; response = Client(HTTP_HOST=settings.ALLOWED_HOSTS[0]).get('/api/v1/health/', secure=True); print(response.status_code, response.content); assert response.status_code == 200"
          REMOTE
          rm -f /tmp/deploy-key /tmp/deploy-known-hosts
