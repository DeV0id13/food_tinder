# FT-07: mandatory checks. Versions/actions reviewed and pinned to full commit SHA.
name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group dev
      - name: Validate pre-commit YAML
        run: pre-commit validate-config
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check (read-only)
        run: ruff format --check .
      - name: File hygiene (read-only CI check)
        run: |
          pre-commit run check-yaml --all-files
          pre-commit run check-json --all-files
          pre-commit run check-toml --all-files
          pre-commit run check-merge-conflict --all-files
          pre-commit run trailing-whitespace --all-files
          pre-commit run end-of-file-fixer --all-files
          pre-commit run mixed-line-ending --all-files

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group dev
      - name: mypy (same command as local pre-commit)
        run: python .github/scripts/run_mypy.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23.5"
      - name: Build pinned Gitleaks CLI (verified Go module)
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan complete available history (including intermediate commits)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . \
            --log-opts="--all" \
            --config=.github/security/gitleaks.toml \
            --gitleaks-ignore-path=.github/security/.gitleaksignore \
            --redact --verbose --no-banner

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep Community Edition CLI
        run: python -m pip install "setuptools==80.9.0" "semgrep==1.122.0"
      - name: Python/Django and JavaScript SAST (fail on findings or scan errors)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --config .github/security/semgrep/ \
            --error --metrics=off \
            --exclude 'node_modules/**' --exclude 'dist/**' \
            --exclude '**/migrations/**' \
            apps common config manage.py frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodtinder_ci
          POSTGRES_USER: foodtinder_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodtinder_ci -d foodtinder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-backend-not-a-real-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: foodtinder_ci
      POSTGRES_USER: foodtinder_ci
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install "pip>=25.1"
          python -m pip install --group dev
      - name: Django system check
        run: python manage.py check
      - name: Missing model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply all migrations on clean PostgreSQL
        run: python manage.py migrate --noinput
      - name: Full pytest suite
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.28.13
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm run build
      - name: Verify build artifact
        run: test -f dist/index.html

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize Trivy report artifact
        run: printf 'Trivy has not completed yet. Inspect workflow logs.\\n' > trivy-full.txt
      - name: Build development target
        run: docker build --target development -t foodtinder-backend:ci-dev .
      - name: Build production target
        run: docker build --target production -t foodtinder-backend:ci-prod .
      - name: Validate production Compose with placeholder secrets
        run: |
          trap 'rm -f .env.prod' EXIT
          cat > .env.prod <<'EOF'
          DJANGO_SECRET_KEY=ci-compose-placeholder
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost
          CSRF_TRUSTED_ORIGINS=http://localhost
          POSTGRES_DB=foodtinder
          POSTGRES_USER=foodtinder
          POSTGRES_PASSWORD=ci-compose-placeholder
          POSTGRES_HOST=postgres
          SITE_ADDRESS=:80
          EOF
          IMAGE_TAG=ci-validation docker compose -f compose.prod.yaml --env-file .env.prod config --quiet
      - name: Trivy full vulnerability report (all severities)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: foodtinder-backend:ci-prod
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          trivy-config: .github/security/trivy.yaml
          cache: "true"
          output: trivy-full.txt
      - name: Trivy HIGH/CRITICAL blocking gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: foodtinder-backend:ci-prod
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          trivy-config: .github/security/trivy.yaml
          cache: "true"
          output: trivy-blocking.txt
      - name: Show blocking CVEs in job log for triage
        if: failure()
        run: |
          if [ -f trivy-blocking.txt ]; then
            sed -n '1,120p' trivy-blocking.txt
          fi
      - name: Upload Trivy reports even if a gate failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-ci
          path: |
            trivy-full.txt
            trivy-blocking.txt
          if-no-files-found: error

  deploy:
    name: deploy production
    needs: [lint, typecheck, secrets, sast, backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build production images
        run: |
          docker build --target production -t ghcr.io/dev0id13/food_tinder-backend:"$GITHUB_SHA" .
          docker build -f deploy/Dockerfile.frontend -t ghcr.io/dev0id13/food_tinder-frontend:"$GITHUB_SHA" .

      - name: Publish immutable image tags
        run: |
          docker push ghcr.io/dev0id13/food_tinder-backend:"$GITHUB_SHA"
          docker push ghcr.io/dev0id13/food_tinder-frontend:"$GITHUB_SHA"

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          # GitHub secrets may have CRLF or escaped line breaks after copying.
          # Normalize the key and fail clearly if it is still malformed.
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > /tmp/deploy-key
          printf '\n' >> /tmp/deploy-key
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > /tmp/deploy-known-hosts
          test -n "$DEPLOY_HOST"
          if ! ssh-keygen -y -P '' -f /tmp/deploy-key >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid unencrypted OpenSSH private key. Re-save the full key (including BEGIN/END lines) in the production environment secret." >&2
            exit 1
          fi
          ssh -i /tmp/deploy-key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/tmp/deploy-known-hosts \
              "foodtinder-mac@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          cd /opt/foodtinder
          # The manifest and images must be from the same reviewed commit.
          git fetch --prune origin master
          test "$(git rev-parse origin/master)" = "$IMAGE_TAG"
          git checkout -q master
          git reset --hard "$IMAGE_TAG"
          test -f .env.prod || { echo "Missing .env.prod" >&2; exit 1; }
          export IMAGE_TAG
          compose() { sudo -n env IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.prod.yaml --env-file .env.prod "$@"; }
          # Fail early if production interpolation is incomplete.
          compose config --quiet
          compose pull
          compose up -d --wait postgres
          # Named volumes start owned by root; allow the unprivileged Django app to write media/static.
          compose run --rm --interactive=false -T --user root web sh -c 'chown -R app:app /app/staticfiles /app/media/recipes'
          compose run --rm --interactive=false -T web python manage.py migrate --noinput
          compose run --rm --interactive=false -T web python manage.py collectstatic --noinput
          compose up -d --remove-orphans web proxy
          compose ps
          # Fail if an expected service did not remain running.
          compose ps --status running --services | grep -qx postgres
          compose ps --status running --services | grep -qx web
          compose ps --status running --services | grep -qx proxy
          # Internal Django health check uses the configured allowed hostname.
          compose exec -T web python manage.py shell -c \
              "from django.conf import settings; from django.test import Client; response = Client(HTTP_HOST=settings.ALLOWED_HOSTS[0]).get('/api/v1/health/', secure=True); print(response.status_code, response.content); assert response.status_code == 200"
          # For the initial IP-based HTTP deployment, also verify the reverse proxy.
          if grep -qx 'SITE_ADDRESS=:80' .env.prod; then
            curl --fail --silent --show-error --retry 8 --retry-delay 3 http://127.0.0.1/api/v1/health/
            curl --fail --silent --show-error --retry 8 --retry-delay 3 http://127.0.0.1/ > /dev/null
          fi
          REMOTE
          rm -f /tmp/deploy-key /tmp/deploy-known-hosts
