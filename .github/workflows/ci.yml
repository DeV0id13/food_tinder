# FT-07: mandatory checks. Versions/actions reviewed and pinned to full commit SHA.
name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR checks only; never interrupt a master deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development dependencies with uv
        run: uv sync --locked --only-group dev
      - name: Verify uv.lock matches project metadata
        run: uv lock --check
      - name: Validate pre-commit YAML
        run: uv run --locked --only-group dev pre-commit validate-config
      - name: Ruff check
        run: uv run --locked --only-group dev ruff check .
      - name: Ruff format check (read-only)
        run: uv run --locked --only-group dev ruff format --check .
      - name: File hygiene (read-only CI check)
        run: |
          uv run --locked --only-group dev pre-commit run check-yaml --all-files
          uv run --locked --only-group dev pre-commit run check-json --all-files
          uv run --locked --only-group dev pre-commit run check-toml --all-files
          uv run --locked --only-group dev pre-commit run check-merge-conflict --all-files
          uv run --locked --only-group dev pre-commit run trailing-whitespace --all-files
          uv run --locked --only-group dev pre-commit run end-of-file-fixer --all-files
          uv run --locked --only-group dev pre-commit run mixed-line-ending --all-files

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development dependencies with uv
        run: uv sync --locked --only-group dev
      - name: mypy (same command as local pre-commit)
        run: uv run --locked --only-group dev python .github/scripts/run_mypy.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23.5"
      - name: Build pinned Gitleaks CLI (verified Go module)
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: Scan complete available history (including intermediate commits)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git . \
            --log-opts="--all" \
            --config=.github/security/gitleaks.toml \
            --gitleaks-ignore-path=.github/security/.gitleaksignore \
            --redact --verbose --no-banner

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked Semgrep security dependencies with uv
        run: uv sync --locked --only-group security
      - name: Python/Django and JavaScript SAST (fail on findings or scan errors)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          uv run --locked --only-group security semgrep scan --config .github/security/semgrep/ \
            --error --metrics=off \
            --exclude 'node_modules/**' --exclude 'dist/**' \
            --exclude '**/migrations/**' \
            apps common config manage.py frontend

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodtinder_ci
          POSTGRES_USER: foodtinder_ci
          POSTGRES_PASSWORD: ci-only-not-a-real-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodtinder_ci -d foodtinder_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-backend-not-a-real-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: foodtinder_ci
      POSTGRES_USER: foodtinder_ci
      POSTGRES_PASSWORD: ci-only-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked development dependencies with uv
        run: uv sync --locked --only-group dev
      - name: Django system check
        run: uv run --locked --only-group dev python manage.py check
      - name: Missing model migrations
        run: uv run --locked --only-group dev python manage.py makemigrations --check --dry-run
      - name: Apply all migrations on clean PostgreSQL
        run: uv run --locked --only-group dev python manage.py migrate --noinput
      - name: Generate and validate OpenAPI
        run: uv run --locked --only-group dev python manage.py spectacular --file /tmp/foodtinder-openapi.yaml --validate --fail-on-warn
      - name: Full pytest suite with branch coverage
        run: >-
          uv run --locked --only-group dev pytest --durations=20 --cov
          --cov-report=term-missing --cov-report=html --cov-report=xml
      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # GHCR push is restricted to master push steps below.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.28.13
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm run build
      - name: Verify build artifact
        run: test -f dist/index.html

      # Package the exact Vite output already built on this runner; do not build Node again.
      - name: Package verified frontend build in Caddy
        run: >-
          docker build --target ci-prebuilt --build-context frontend_dist=./dist
          -f ../deploy/Dockerfile.frontend -t foodtinder-frontend:ci ..
      - name: Validate released Caddy configuration
        run: |
          docker run --rm -e SITE_ADDRESS=:80 foodtinder-frontend:ci caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e SITE_ADDRESS=foodtinder.example.test foodtinder-frontend:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Login to GHCR for master only
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish tested frontend image once
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag foodtinder-frontend:ci ghcr.io/dev0id13/food_tinder-frontend:"$GITHUB_SHA"
          docker push ghcr.io/dev0id13/food_tinder-frontend:"$GITHUB_SHA"

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR push is restricted to master after Trivy gates.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize Trivy report artifact
        run: printf 'Trivy has not completed yet. Inspect workflow logs.\n' > trivy-status.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate development target without exporting an unused image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: development
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=foodtinder-backend-dev
            type=gha,scope=foodtinder-backend-prod
          cache-to: type=gha,mode=max,scope=foodtinder-backend-dev
      - name: Build production target for scan and release
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: production
          load: true
          tags: foodtinder-backend:ci-prod
          cache-from: |
            type=gha,scope=foodtinder-backend-prod
            type=gha,scope=foodtinder-backend-dev
          cache-to: type=gha,mode=max,scope=foodtinder-backend-prod
      - name: Validate Compose and smoke-test production observability
        run: |
          trap 'rm -f .env.prod .env.demo' EXIT
          cat > .env.prod <<'EOF'
          DJANGO_SECRET_KEY=ci-compose-placeholder
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost
          CSRF_TRUSTED_ORIGINS=http://localhost
          POSTGRES_DB=foodtinder
          POSTGRES_USER=foodtinder
          POSTGRES_PASSWORD=ci-compose-placeholder
          POSTGRES_HOST=postgres
          SITE_ADDRESS=:80
          EOF
          python3 docker/init_env.py --demo
          docker compose --env-file .env.demo -f compose.demo.yaml config --quiet
          IMAGE_TAG=ci-validation docker compose -f compose.prod.yaml --env-file .env.prod --profile monitoring config --quiet
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/monitoring/prometheus:/etc/foodtinder:ro" prom/prometheus:v3.15.1 \
            check config /etc/foodtinder/prometheus.yml

          docker run --rm --env-file .env.prod foodtinder-backend:ci-prod \
            sh /app/docker/start_gunicorn.sh --print-config > /tmp/foodtinder-gunicorn.txt
          grep -Eq '^workers + = 2$' /tmp/foodtinder-gunicorn.txt
          grep -Eq '^threads + = 2$' /tmp/foodtinder-gunicorn.txt
          grep -Eq '^worker_class + = gthread$' /tmp/foodtinder-gunicorn.txt

          docker run --rm --detach --name ft-ci-http --env-file .env.prod \
            -e SECURE_SSL_REDIRECT=false -e POSTGRES_HOST=127.0.0.1 \
            -p 127.0.0.1:18000:8000 foodtinder-backend:ci-prod
          trap 'docker stop ft-ci-http >/dev/null; rm -f .env.prod .env.demo' EXIT
          # During container startup the published socket can reset a request before either worker is ready.
          if ! curl -4 --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --max-time 4 \
              http://localhost:18000/_metrics/ > /tmp/foodtinder-metrics-startup; then
            docker logs ft-ci-http
            exit 1
          fi
          grep '^foodtinder_database_ready 0.0$' /tmp/foodtinder-metrics-startup
          curl -4 --fail --silent --show-error --max-time 4 \
            -D /tmp/foodtinder-headers http://localhost:18000/api/v1/health/
          grep -Eiq '^X-Request-ID: [a-f0-9-]{36}' /tmp/foodtinder-headers
          curl -4 --fail --silent --show-error --max-time 4 http://localhost:18000/_metrics/ > /tmp/foodtinder-metrics
          grep '^foodtinder_api_requests_total{.*"health".*} 1.0$' /tmp/foodtinder-metrics
      - name: Trivy vulnerability scan (all severities, single pass)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: foodtinder-backend:ci-prod
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          trivy-config: .github/security/trivy.yaml
          cache: "true"
          output: trivy-full.json
      - name: Trivy HIGH/CRITICAL blocking gate (same scan)
        run: python3 .github/scripts/check_trivy.py trivy-full.json trivy-blocking.txt
      # Publish the exact local image that passed Trivy, without rebuilding it.
      - name: Login to GHCR for master only
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish scanned production backend image once
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag foodtinder-backend:ci-prod ghcr.io/dev0id13/food_tinder-backend:"$GITHUB_SHA"
          docker push ghcr.io/dev0id13/food_tinder-backend:"$GITHUB_SHA"

      - name: Show blocking CVEs in job log for triage
        if: failure()
        run: |
          if [ -f trivy-blocking.txt ]; then
            sed -n '1,120p' trivy-blocking.txt
          fi
      - name: Upload Trivy reports even if a gate failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-ci
          path: |
            trivy-status.txt
            trivy-full.json
            trivy-blocking.txt
          if-no-files-found: error

  deploy:
    name: deploy production
    needs: [lint, typecheck, secrets, sast, backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # docker/frontend jobs already built and pushed SHA-tagged images.
      # This job only deploys the images from the checked master commit.
      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          # GitHub secrets may have CRLF or escaped line breaks after copying.
          # Normalize the key and fail clearly if it is still malformed.
          printf '%s' "$DEPLOY_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > /tmp/deploy-key
          printf '\n' >> /tmp/deploy-key
          printf '%s\n' "$HOST_KEYS" | tr -d '\r' > /tmp/deploy-known-hosts
          test -n "$DEPLOY_HOST"
          if ! ssh-keygen -y -P '' -f /tmp/deploy-key >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a valid unencrypted OpenSSH private key. Re-save the full key (including BEGIN/END lines) in the production environment secret." >&2
            exit 1
          fi
          ssh -i /tmp/deploy-key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/tmp/deploy-known-hosts \
              "foodtinder-mac@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          IMAGE_TAG="$1"
          cd /opt/foodtinder
          # The manifest and images must be from the same reviewed commit.
          git fetch --prune origin master
          test "$(git rev-parse origin/master)" = "$IMAGE_TAG"
          git checkout -q master
          git reset --hard "$IMAGE_TAG"
          test -f .env.prod || { echo "Missing .env.prod" >&2; exit 1; }
          export IMAGE_TAG
          # Compose compares this tree SHA to detect changed bind-mounted configuration.
          MONITORING_CONFIG_SHA="$(git rev-parse "$IMAGE_TAG:deploy/monitoring")"
          compose() { sudo -n env IMAGE_TAG="$IMAGE_TAG" MONITORING_CONFIG_SHA="$MONITORING_CONFIG_SHA" docker compose -f compose.prod.yaml --env-file .env.prod "$@"; }
          # Fail early if production interpolation is incomplete.
          compose config --quiet
          # Do not pull/recreate PostgreSQL during routine app releases.
          compose pull web proxy
          compose up -d --wait postgres
          # Production volume ownership is initialized once (docs/deployment.md).
          # Use one ephemeral web container for migration and static collection.
          compose run --rm --interactive=false -T --no-deps web sh -ec '
            for path in /app/staticfiles /app/media/recipes; do
              if [ ! -w "$path" ]; then
                echo "Volume $path is not writable by app; see docs/deployment.md" >&2
                exit 1
              fi
            done
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
          '
          compose up -d --remove-orphans web proxy
          compose ps
          # Fail if an expected service did not remain running.
          compose ps --status running --services | grep -qx postgres
          compose ps --status running --services | grep -qx web
          compose ps --status running --services | grep -qx proxy
          # Probe the worker's Django configuration even when TLS terminates at Caddy.
          compose exec -T web python manage.py shell -c '
          from time import sleep
          from django.conf import settings
          from django.test import Client
          client = Client(HTTP_HOST=settings.ALLOWED_HOSTS[0])
          for attempt in range(8):
              response = client.get("/api/v1/ready/", secure=True)
              if response.status_code == 200:
                  break
              if attempt == 7:
                  raise SystemExit(f"Django readiness failed: HTTP {response.status_code}")
              sleep(3)
          ' </dev/null
          # The IP-based HTTP deployment also exercises the real Gunicorn/Caddy path.
          if grep -qx 'SITE_ADDRESS=:80' .env.prod; then
            allowed_host="$(compose exec -T web python -c 'import config.settings as settings; print(settings.ALLOWED_HOSTS[0])' </dev/null)"
            bash deploy/check-http.sh http://127.0.0.1 "$allowed_host" </dev/null
          fi
          # Monitoring is part of every approved deploy, without extra VM setup.
          # Failure is reported without stopping the verified application.
          # Reuse healthy services and pinned images; recreate only on changed config/tag.
          compose --profile monitoring up -d --no-deps --pull missing --wait --wait-timeout 120 prometheus grafana node-exporter
          bash deploy/check-monitoring.sh "$IMAGE_TAG" </dev/null
          REMOTE
          rm -f /tmp/deploy-key /tmp/deploy-known-hosts
