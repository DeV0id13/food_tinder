# Temporary workflow to generate the committed uv.lock in the GitHub runner.
# This file is removed before completing PR #34.
name: bootstrap uv.lock
on:
  push:
    branches: [feat/ft-13-ci-cd-performance]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Resolve and emit reviewable lock
        run: |
          uv lock --python 3.12
          uv lock --check
          echo "UV_LOCK_BEGIN_401922"
          cat uv.lock
          echo "UV_LOCK_END_401922"
