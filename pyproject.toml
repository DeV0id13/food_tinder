[project]
name = "food-tinder"
version = "0.1.0"
requires-python = ">=3.12"
# Django application: dependencies only; do not build/publish a wheel.

[tool.uv]
package = false

[dependency-groups]
base = [
    "Django==5.2.17",
    "djangorestframework==3.18.3",
    "psycopg[binary]==3.3.5",
    "Pillow==13.0.0",
]
dev = [
    { include-group = "base" },
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.8",
    "pre-commit==3.8.0",
    "django-stubs[compatible-mypy]==6.1.2",
    "djangorestframework-stubs[compatible-mypy]==3.18.2",
    "mypy==1.18.2",
]
prod = [
    { include-group = "base" },
    "gunicorn==26.2.0",
]
security = [
    "semgrep==1.122.0",
    "setuptools==80.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["apps", "common", "config", "manage.py"]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "(?x)^(.*/(migrations|__pycache__|node_modules|staticfiles|media|dist)/.*)$",
]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"
