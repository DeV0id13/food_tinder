[dependency-groups]
base = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "psycopg[binary]==3.3.5",
    "Pillow==12.3.0",
]
dev = [
    { include-group = "base" },
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.8",
]
prod = [
    { include-group = "base" },
    "gunicorn==26.2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
